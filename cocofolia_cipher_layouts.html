<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>暗号解読盤面 UI案 5種</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#e7e9ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}header{position:sticky;top:0;z-index:5;background:#090b10e8;backdrop-filter:blur(10px);border-bottom:1px solid #252b36;padding:16px 22px;display:flex;align-items:center;gap:18px}h1{font-size:18px;margin:0;letter-spacing:.08em}.hint{color:#8f99aa;font-size:12px}.tabs{margin-left:auto;display:flex;gap:6px}.tabs button{border:1px solid #343c49;background:#11151d;color:#bfc7d5;padding:7px 11px;border-radius:20px;cursor:pointer}.tabs button.on{background:#e9edf5;color:#10131a}.wrap{max-width:1500px;margin:auto;padding:24px}.page{display:none}.page.on{display:block}.intro{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}.intro h2{margin:0 0 8px;font-size:28px}.intro p{margin:0;color:#aab3c2;line-height:1.7}.legend{display:flex;justify-content:flex-end;gap:8px;align-items:start;flex-wrap:wrap}.tag{font-size:11px;padding:5px 9px;border-radius:4px;border:1px solid}.notice{color:#8ee6ff;border-color:#28788c;background:#0d2830}.hyp{color:#ffd985;border-color:#846b27;background:#2c2512}.src{color:#c9a7ff;border-color:#62458f;background:#211831}.ded{color:#9af0ae;border-color:#377e48;background:#13271a}.board{position:relative;min-height:690px;border:1px solid #303745;border-radius:14px;overflow:hidden;background-color:#10141b;background-image:linear-gradient(#171d27 1px,transparent 1px),linear-gradient(90deg,#171d27 1px,transparent 1px);background-size:28px 28px;box-shadow:inset 0 0 80px #0008}.panel{position:absolute;border:1px solid #475264;background:#171c25eF;border-radius:7px;padding:10px 12px;box-shadow:0 6px 18px #0008;min-width:130px}.panel b{display:block;font-size:12px;margin-bottom:5px}.panel small{color:#8e99aa;line-height:1.35}.panel.notice{border-left:4px solid #53cde9}.panel.hyp{border-left:4px solid #e7bd4f}.panel.src{border-left:4px solid #a77aea}.panel.ded{border-left:4px solid #68d782}.zone{position:absolute;border:1px dashed #445064;border-radius:12px;padding:10px;color:#69778b;font-size:12px;letter-spacing:.12em}.line{position:absolute;height:1px;background:#566174;transform-origin:left center;opacity:.55}.center{position:absolute;border:1px solid #75829a;background:#202734;border-radius:50%;display:grid;place-items:center;text-align:center;box-shadow:0 0 40px #5f6d8833}.footer{margin-top:13px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.card{border:1px solid #29313d;background:#11161e;border-radius:9px;padding:12px}.card b{font-size:12px}.card p{font-size:12px;color:#919cac;line-height:1.55;margin:6px 0 0}.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px;height:690px}.col{border:1px solid #303948;background:#0d1118aa;border-radius:10px;padding:12px}.col h3{font-size:12px;letter-spacing:.15em;margin:0 0 14px;color:#8e9bad}.col .panel{position:relative;left:auto!important;top:auto!important;margin:9px 0}.timeline{position:absolute;left:8%;right:8%;top:51%;height:2px;background:#4a5568}.node{position:absolute;top:calc(51% - 8px);width:16px;height:16px;border:3px solid #c4ccda;background:#11151d;border-radius:50%}.label{position:absolute;top:54%;font-size:11px;color:#6f7c90}.matrix{display:grid;grid-template-columns:120px repeat(4,1fr);grid-template-rows:70px repeat(4,1fr);gap:8px;padding:20px;height:690px}.mh{display:grid;place-items:center;color:#7f8b9d;font-size:11px}.cell{border:1px solid #303a49;background:#0e131a;border-radius:8px;position:relative;padding:8px}.cell .panel{position:relative;left:auto!important;top:auto!important;min-width:0;margin:3px}.radar{position:absolute;inset:80px 220px;border:1px solid #394455;border-radius:50%}.radar:before,.radar:after{content:'';position:absolute;inset:20%;border:1px solid #303a49;border-radius:50%}.radar:after{inset:40%}.axisH,.axisV{position:absolute;background:#354052}.axisH{left:12%;right:12%;top:50%;height:1px}.axisV{top:10%;bottom:10%;left:50%;width:1px}@media(max-width:900px){.intro{grid-template-columns:1fr}.legend{justify-content:flex-start}.board{min-width:1000px}.wrap{overflow:auto}.footer{grid-template-columns:1fr}.tabs{overflow:auto;max-width:55vw}.tabs button{white-space:nowrap}}
</style></head><body><header><h1>CIPHER BOARD / 5 LAYOUT STUDIES</h1><span class='hint'>ココフォリア・スクリーンパネル用 構成ラフ</span><div class='tabs' id='tabs'></div></header><main class='wrap' id='app'></main><script>
const types={notice:['気づき','notice'],hyp:['仮説','hyp'],src:['収集資料','src'],ded:['推察 / 解読','ded']};
function p(t,x,y,title,text){return `<div class="panel ${t}" style="left:${x}%;top:${y}%"><b>${types[t][0]}｜${title}</b><small>${text}</small></div>`}function line(x,y,w,a){return `<i class="line" style="left:${x}%;top:${y}%;width:${w}%;transform:rotate(${a}deg)"></i>`}
const pages=[
{n:'01',title:'捜査壁 — Evidence Wall',desc:'最も直感的な案。中央の「暗号文」を核に、プレイヤーが発見した情報を周囲へ貼り、関係が見えたものだけを近づける。盤面そのものが探偵ドラマの捜査ボードになります。',html:`<div class='board'>${line(47,45,24,-145)}${line(48,47,25,-25)}${line(48,48,20,140)}${line(48,48,25,25)}<div class='center' style='left:40%;top:36%;width:190px;height:190px'><b>ENCRYPTED<br>MESSAGE</b><small>原暗号文<br>「XQ-17 / …」</small></div>${p('notice',10,13,'反復','7文字ごとに同じ記号')}${p('src',68,12,'新聞切抜','失踪日は17日')}${p('hyp',12,68,'周期鍵？','日付が鍵長かもしれない')}${p('src',70,67,'録音記録','同じ語を3回強調')}${p('ded',66,39,'KEY = 17','周期17で再配置すると…')}</div>`},
{n:'02',title:'推理パイプライン — Investigation Flow',desc:'情報を「気づく→仮説化→裏取り→解読」の順に左から右へ動かす案。進捗が一目で分かり、ゲームとして「カードを次の段階へ昇格させる」操作が明確です。',html:`<div class='board'><div class='cols'><div class='col'><h3>01 / OBSERVE</h3>${p('notice',0,0,'文字頻度','E相当の記号が多い')}${p('notice',0,0,'区切り','4・4・2文字')}</div><div class='col'><h3>02 / HYPOTHESIS</h3>${p('hyp',0,0,'換字式','単一換字暗号？')}${p('hyp',0,0,'固有名詞','4文字は地名？')}</div><div class='col'><h3>03 / EVIDENCE</h3>${p('src',0,0,'地図','4文字の駅名あり')}${p('src',0,0,'手帳','A→Q の書込み')}</div><div class='col'><h3>04 / DECODE</h3>${p('ded',0,0,'対応確定','A = Q')}${p('ded',0,0,'部分解読','＿ATE / ＿ATE')}</div></div></div>`},
{n:'03',title:'仮説軌道 — Orbit Board',desc:'中央に暗号文、内周ほど確度が高く、外周ほど未検証という配置。資料や仮説をドラッグして中心へ近づけるだけで「確信度」が可視化されます。',html:`<div class='board'><div class='radar'></div><div class='axisH'></div><div class='axisV'></div><div class='center' style='left:44%;top:40%;width:150px;height:150px'><b>解読核</b><small>現在 38%</small></div>${p('ded',56,43,'確定断片','「MIDNIGHT」')}${p('src',28,27,'時刻表','最終便 00:10')}${p('hyp',67,24,'時刻鍵','00:10が鍵？')}${p('notice',18,65,'数字列','0010が2回出現')}${p('hyp',72,69,'人物名鍵','署名を使う可能性')}</div>`},
{n:'04',title:'時系列解読 — Case Timeline',desc:'暗号に関係する事件・資料の時間を横軸に固定し、その上下に仮説と解読を置く案。「いつ何が起きたか」が暗号の鍵になるシナリオに強く、推理の矛盾も見つけやすい構成です。',html:`<div class='board'><div class='timeline'></div><i class='node' style='left:14%'></i><i class='node' style='left:36%'></i><i class='node' style='left:59%'></i><i class='node' style='left:82%'></i><span class='label' style='left:12%'>21:30</span><span class='label' style='left:34%'>22:15</span><span class='label' style='left:57%'>23:40</span><span class='label' style='left:80%'>00:10</span>${p('src',7,18,'監視映像','人物Aが入館')}${p('notice',28,65,'時刻欠損','22:15だけ記録なし')}${p('hyp',49,15,'空白時間','暗号生成時刻？')}${p('src',70,66,'最終便','00:10 発')}${p('ded',72,19,'数字列','2115 → 0010')}</div>`},
{n:'05',title:'照合マトリクス — Cross Analysis',desc:'縦軸を情報源、横軸を暗号上の論点にした分析盤。資料同士の一致・矛盾をセルに置くため、複数の証拠を組み合わせて一つの解読へ到達するタイプに向きます。',html:`<div class='board'><div class='matrix'><div></div><div class='mh'>人物</div><div class='mh'>場所</div><div class='mh'>時刻</div><div class='mh'>文字列</div><div class='mh'>手帳</div><div class='cell'>${p('src',0,0,'署名','K.S.')}</div><div class='cell'></div><div class='cell'>${p('notice',0,0,'17','丸印')}</div><div class='cell'></div><div class='mh'>新聞</div><div class='cell'></div><div class='cell'>${p('src',0,0,'倉庫B','事件現場')}</div><div class='cell'></div><div class='cell'></div><div class='mh'>暗号文</div><div class='cell'>${p('hyp',0,0,'KS','鍵候補')}</div><div class='cell'>${p('hyp',0,0,'B','列指定？')}</div><div class='cell'>${p('ded',0,0,'17','鍵長確定')}</div><div class='cell'>${p('ded',0,0,'断片','OPEN…')}</div><div class='mh'>録音</div><div class='cell'></div><div class='cell'></div><div class='cell'>${p('src',0,0,'23:40','録音開始')}</div><div class='cell'></div></div></div>`}
];
const tabs=document.getElementById('tabs'),app=document.getElementById('app');pages.forEach((q,i)=>{tabs.innerHTML+=`<button data-i='${i}' class='${i===0?'on':''}'>${q.n}</button>`;app.innerHTML+=`<section class='page ${i===0?'on':''}' data-i='${i}'><div class='intro'><div><h2>${q.n}. ${q.title}</h2><p>${q.desc}</p></div><div class='legend'>${Object.values(types).map(v=>`<span class='tag ${v[1]}'>${v[0]}</span>`).join('')}</div></div>${q.html}<div class='footer'><div class='card'><b>ゲーム上の強み</b><p>${['自由な連想と関係線が主役。プレイヤーの思考痕跡が盤面に残る。','進捗管理が明快。パネルを右へ進める行為そのものを報酬化できる。','確信度を空間距離で表現。誤説を外側へ戻す操作も自然。','時刻・アリバイ・事件順序を扱う暗号に強い。','複数資料のクロスチェックをゲーム化しやすい。'][i]}</p></div><div class='card'><b>ココフォリア適性</b><p>${['◎ スクリーンパネルを自由配置する機能と非常に相性が良い。','◎ 列ごとに背景を作り、パネルを移動するだけで成立。','○ 円形ガイド背景を1枚用意すると運用しやすい。','◎ 横長盤面と相性がよく、情報追加も容易。','○ 整列が必要だが、固定グリッド背景で安定する。'][i]}</p></div><div class='card'><b>向いている体験</b><p>${['探偵的・自由推理','段階的・ゲーム的','直感的・仮説更新','事件捜査・時系列推理','論理パズル・証拠照合'][i]}</p></div></div></section>`});tabs.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');document.querySelector(`.page[data-i="${e.target.dataset.i}"]`).classList.add('on')};
</script></body></html>
